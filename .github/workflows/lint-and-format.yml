name: Lint and Format

on:
  push:
    branches:
      - main
      - next
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Oxlint & Oxfmt Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exercise quality gate failure and success cases
        run: bun run quality:test

      - name: Check code formatting (Oxfmt)
        run: bun run format:check

      - name: Run linter (Oxlint)
        run: bun scripts/lint-ratchet.ts

      - name: Check introduced policy and scoped type-aware diagnostics
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run quality:check --base "$POLICY_BASE"

      - name: Check client import direction
        run: bun scripts/check-client-imports.ts
